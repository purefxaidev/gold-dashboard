name: Update dashboard
# GitHub cron is supplemented by a box-side refresh every ~5 minutes (spot.json).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet openpyxl playwright

      - name: Cache Chromium for share posters
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Refresh spot, analysis, learning, SPDR, and market desk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TZ: Asia/Bangkok
        run: |
          set -e
          python3 spot.py
          python3 perf.py || echo "perf skipped"
          python3 mtf.py || echo "mtf skipped"
          python3 smc.py || echo "smc skipped"
          python3 edge.py || echo "edge skipped"
          python3 spdr.py || echo "spdr skipped"
          python3 learn.py
          python3 insights.py || echo "insights skipped"
          python3 build.py
          # Re-render same-origin share PNGs hourly (and on manual dispatch)
          # so the repo is not bloated with 15MB binaries every 10 minutes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$(date +%M))) -lt 10 ]; then
            python3 -m playwright install --with-deps chromium || python3 -m playwright install chromium || true
            python3 render_share.py || echo "share render skipped"
          else
            echo "share render deferred to the top of the hour"
          fi

      - name: Commit and push
        env:
          TZ: Asia/Bangkok
        run: |
          git config user.name "purefxaidev"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json view.json index.html candles.json spot.json perf.json levels.json spdr.json ai_context.txt \
            history/predictions.jsonl history/weights.json history/accuracy.json \
            history/news_impact.jsonl history/trade_journal.jsonl history/feargreed.jsonl \
            news.json news.html events.json cot.json feargreed.json compare.json brief.json dollar.json share/*.png || true
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "update $(date '+%F %H:%M')"
          git pull --rebase --autostash origin main
          git push origin main
